{% extends 'layout.html' %}

{% block content %}
<style>
	body {
		margin: 0;
		padding: 0;
		overflow-x: hidden;
		overflow-y: auto;
		background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
		position: relative;
		cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text y="24" font-size="24">🐝</text></svg>') 16 16, auto;
	}

	/* Scrollbar personnalisée */
	body::-webkit-scrollbar {
		width: 12px;
	}

	body::-webkit-scrollbar-track {
		background: #1a1a1a;
		border-left: 1px solid #333;
	}

	body::-webkit-scrollbar-thumb {
		background: linear-gradient(180deg, #FFC107 0%, #FFA000 100%);
		border-radius: 6px;
		border: 2px solid #1a1a1a;
	}

	body::-webkit-scrollbar-thumb:hover {
		background: linear-gradient(180deg, #FFD54F 0%, #FFC107 100%);
		box-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
	}

	/* Pour Firefox */
	body {
		scrollbar-width: thin;
		scrollbar-color: #FFC107 #1a1a1a;
	}

	body::before {
		content: '';
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background: 
			radial-gradient(circle at 20% 30%, rgba(255, 193, 7, 0.15) 0%, transparent 50%),
			radial-gradient(circle at 80% 70%, rgba(255, 235, 59, 0.1) 0%, transparent 50%),
			radial-gradient(circle at 50% 50%, rgba(255, 193, 7, 0.05) 0%, transparent 70%);
		pointer-events: none;
		z-index: 0;
	}

	.honeycomb-container {
		position: relative;
		min-height: 150vh;
		padding: 4rem 2rem;
		display: flex;
		justify-content: center;
		align-items: center;
	}

	.honeycomb-grid {
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
		max-width: 1200px;
		margin: 0 auto;
		position: relative;
		z-index: 1;
		transition: transform 0.3s ease;
		transform-origin: center center;
	}

	.hex-row {
		display: flex;
		justify-content: center;
		width: 100%;
	}

	.hex-row:nth-child(even) {
		margin-left: clamp(32px, 5.2vw, 62px);
	}

	.hexagon {
		width: clamp(60px, 10vw, 120px);
		height: clamp(69px, 11.5vw, 138px);
		position: relative;
		margin: clamp(5px, 1vw, 10px) clamp(8px, 1.2vw, 15px);
		cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text y="24" font-size="24">🐝</text></svg>') 16 16, pointer;
		transition: all 0.3s ease;
		clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
		background: linear-gradient(135deg, #FFC107 0%, #FFD54F 50%, #FFA000 100%);
		box-shadow: 
			inset 0 0 clamp(15px, 2vw, 30px) rgba(255, 235, 59, 0.4),
			0 clamp(2px, 0.3vw, 4px) clamp(8px, 1vw, 15px) rgba(255, 193, 7, 0.5),
			0 0 clamp(20px, 2.5vw, 40px) rgba(255, 193, 7, 0.2);
		border: clamp(1.5px, 0.2vw, 3px) solid #FFB300;
		display: flex;
		align-items: center;
		justify-content: center;
		text-decoration: none;
	}

	.hexagon:hover {
		transform: scale(1.1);
		background: linear-gradient(135deg, #FFEB3B 0%, #FFF176 50%, #FFC107 100%);
		box-shadow: 
			inset 0 0 clamp(20px, 2.5vw, 40px) rgba(255, 255, 255, 0.6),
			0 clamp(3px, 0.5vw, 6px) clamp(12px, 1.5vw, 25px) rgba(255, 193, 7, 0.8),
			0 0 clamp(30px, 3vw, 60px) rgba(255, 235, 59, 0.4);
		border-color: #FFD54F;
	}

	.hexagon.clicked {
		animation: zoomPulse 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
	}

	@keyframes zoomPulse {
		0% {
			transform: scale(1);
		}
		50% {
			transform: scale(1.3);
		}
		100% {
			transform: scale(1);
		}
	}

	.hexagon-content {
		position: relative;
		text-align: center;
		color: #1a1a1a;
		font-weight: 700;
		font-size: clamp(0.7rem, 1.3vw, 1rem);
		z-index: 10;
		pointer-events: none;
		text-shadow: 0 1px 3px rgba(255, 235, 59, 0.5);
		transition: all 0.3s ease;
		padding: 0.5rem;
	}

	.hexagon:hover .hexagon-content {
		color: #000;
		text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
	}

	/* Effet de brouillard sur les bords */
	.fog-overlay {
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		pointer-events: none;
		z-index: 100;
	}

	.fog-top {
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 200px;
		background: linear-gradient(to bottom, 
			rgba(26, 26, 26, 1) 0%,
			rgba(26, 26, 26, 0.8) 30%,
			rgba(26, 26, 26, 0) 100%);
	}

	.fog-bottom {
		position: absolute;
		bottom: 0;
		left: 0;
		width: 100%;
		height: 200px;
		background: linear-gradient(to top, 
			rgba(26, 26, 26, 1) 0%,
			rgba(26, 26, 26, 0.8) 30%,
			rgba(26, 26, 26, 0) 100%);
	}

	.fog-left {
		position: absolute;
		top: 0;
		left: 0;
		width: 200px;
		height: 100%;
		background: linear-gradient(to right, 
			rgba(26, 26, 26, 1) 0%,
			rgba(26, 26, 26, 0.8) 30%,
			rgba(26, 26, 26, 0) 100%);
	}

	.fog-right {
		position: absolute;
		top: 0;
		right: 0;
		width: 200px;
		height: 100%;
		background: linear-gradient(to left, 
			rgba(26, 26, 26, 1) 0%,
			rgba(26, 26, 26, 0.8) 30%,
			rgba(26, 26, 26, 0) 100%);
	}

	.page-title {
		text-align: center;
		color: #FFC107;
		font-size: clamp(1.5rem, 4vw, 2.5rem);
		margin-bottom: clamp(1.5rem, 4vw, 3rem);
		text-shadow: 0 2px 10px rgba(255, 193, 7, 0.5), 0 0 20px rgba(255, 235, 59, 0.3);
	}

	/* Media queries pour très petits écrans */
	@media (max-width: 480px) {
		.honeycomb-container {
			padding: 2rem 0.5rem;
		}
		
		.fog-left,
		.fog-right {
			width: 80px;
		}
	}

	/* Media queries pour tablettes */
	@media (min-width: 768px) and (max-width: 1024px) {
		.honeycomb-grid {
			max-width: 900px;
		}
	}

	/* Media queries pour grands écrans */
	@media (min-width: 1400px) {
		.honeycomb-grid {
			max-width: 1400px;
		}
	}

	/* Contrôles de zoom */
	.zoom-controls {
		position: fixed;
		bottom: 30px;
		right: 30px;
		display: flex;
		flex-direction: column;
		gap: 10px;
		z-index: 200;
	}

	.zoom-btn {
		width: 50px;
		height: 50px;
		border-radius: 50%;
		background: linear-gradient(135deg, #FFC107 0%, #FFA000 100%);
		border: 2px solid #FFB300;
		color: #1a1a1a;
		font-size: 1.5rem;
		font-weight: bold;
		cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text y="24" font-size="24">🐝</text></svg>') 16 16, pointer;
		transition: all 0.3s ease;
		box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
		display: flex;
		align-items: center;
		justify-content: center;
	}

	.zoom-btn:hover {
		background: linear-gradient(135deg, #FFEB3B 0%, #FFC107 100%);
		box-shadow: 0 6px 20px rgba(255, 193, 7, 0.6);
		transform: scale(1.1);
	}

	.zoom-btn:active {
		transform: scale(0.95);
	}

	.zoom-level {
		text-align: center;
		color: #FFC107;
		font-size: 0.9rem;
		font-weight: 600;
		text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
	}

	/* Score du joueur */
	.score-panel {
		position: fixed;
		top: 100px;
		right: 30px;
		background: rgba(26, 26, 26, 0.95);
		border: 3px solid #FFC107;
		border-radius: 20px;
		padding: 20px;
		box-shadow: 0 8px 30px rgba(255, 193, 7, 0.4);
		z-index: 200;
		min-width: 200px;
	}

	.score-title {
		color: #FFC107;
		font-size: 1.1rem;
		font-weight: 700;
		text-align: center;
		margin-bottom: 15px;
		text-shadow: 0 2px 10px rgba(255, 193, 7, 0.5);
	}

	.score-value {
		color: #FFD54F;
		font-size: 2rem;
		font-weight: 700;
		text-align: center;
		margin-bottom: 15px;
		text-shadow: 0 2px 10px rgba(255, 193, 7, 0.3);
	}

	.reset-btn {
		width: 100%;
		padding: 10px 15px;
		background: linear-gradient(135deg, #F44336 0%, #D32F2F 100%);
		color: white;
		border: 2px solid #E53935;
		border-radius: 25px;
		font-size: 0.9rem;
		font-weight: 600;
		cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text y="24" font-size="24">🐝</text></svg>') 16 16, pointer;
		transition: all 0.3s ease;
		box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
	}

	.reset-btn:hover {
		background: linear-gradient(135deg, #EF5350 0%, #F44336 100%);
		box-shadow: 0 6px 20px rgba(244, 67, 54, 0.6);
		transform: scale(1.05);
	}

	.reset-btn:active {
		transform: scale(0.95);
	}

	/* Couleurs par thème */
	.hexagon.theme-1 {
		background: linear-gradient(135deg, #66BB6A 0%, #81C784 50%, #4CAF50 100%);
		border-color: #4CAF50;
	}

	.hexagon.theme-1:hover {
		background: linear-gradient(135deg, #81C784 0%, #A5D6A7 50%, #66BB6A 100%);
		border-color: #81C784;
	}

	.hexagon.theme-2 {
		background: linear-gradient(135deg, #42A5F5 0%, #64B5F6 50%, #2196F3 100%);
		border-color: #2196F3;
	}

	.hexagon.theme-2:hover {
		background: linear-gradient(135deg, #64B5F6 0%, #90CAF9 50%, #42A5F5 100%);
		border-color: #64B5F6;
	}

	.hexagon.theme-3 {
		background: linear-gradient(135deg, #AB47BC 0%, #BA68C8 50%, #9C27B0 100%);
		border-color: #9C27B0;
	}

	.hexagon.theme-3:hover {
		background: linear-gradient(135deg, #BA68C8 0%, #CE93D8 50%, #AB47BC 100%);
		border-color: #BA68C8;
	}

	.hexagon.theme-4 {
		background: linear-gradient(135deg, #FFA726 0%, #FFB74D 50%, #FF9800 100%);
		border-color: #FF9800;
	}

	.hexagon.theme-4:hover {
		background: linear-gradient(135deg, #FFB74D 0%, #FFCC80 50%, #FFA726 100%);
		border-color: #FFB74D;
	}

	.hexagon.theme-5 {
		background: linear-gradient(135deg, #EF5350 0%, #E57373 50%, #F44336 100%);
		border-color: #F44336;
	}

	.hexagon.theme-5:hover {
		background: linear-gradient(135deg, #E57373 0%, #EF9A9A 50%, #EF5350 100%);
		border-color: #E57373;
	}

	/* Tooltip pour afficher le thème */
	.theme-tooltip {
		position: fixed;
		background: rgba(0, 0, 0, 0.9);
		color: #FFC107;
		padding: 0.8rem 1.5rem;
		border-radius: 15px;
		font-size: 0.95rem;
		font-weight: 600;
		pointer-events: none;
		z-index: 1000;
		opacity: 0;
		transform: translateY(10px);
		transition: opacity 0.3s ease, transform 0.3s ease;
		border: 2px solid #FFC107;
		box-shadow: 0 4px 20px rgba(255, 193, 7, 0.4);
		white-space: nowrap;
	}

	.theme-tooltip.show {
		opacity: 1;
		transform: translateY(0);
	}

	.theme-tooltip.theme-1 {
		color: #81C784;
		border-color: #81C784;
	}

	.theme-tooltip.theme-2 {
		color: #64B5F6;
		border-color: #64B5F6;
	}

	.theme-tooltip.theme-3 {
		color: #BA68C8;
		border-color: #BA68C8;
	}

	.theme-tooltip.theme-4 {
		color: #FFB74D;
		border-color: #FFB74D;
	}

	.theme-tooltip.theme-5 {
		color: #E57373;
		border-color: #E57373;
	}

	/* Hexagone central musical avec effet shiny */
	.hexagon.music-center {
		background: linear-gradient(135deg, #FFD700 0%, #FFF176 25%, #FFD700 50%, #FFF176 75%, #FFD700 100%);
		background-size: 200% 200%;
		animation: shinyGlow 3s ease-in-out infinite;
		border: clamp(2px, 0.3vw, 4px) solid #FFE082;
		box-shadow: 
			inset 0 0 clamp(25px, 3vw, 50px) rgba(255, 255, 255, 0.7),
			0 0 clamp(30px, 3.5vw, 60px) rgba(255, 215, 0, 0.8),
			0 clamp(4px, 0.6vw, 8px) clamp(15px, 2vw, 30px) rgba(255, 215, 0, 0.6);
		position: relative;
		overflow: hidden;
	}

	.hexagon.music-center::before {
		content: '';
		position: absolute;
		top: -50%;
		left: -50%;
		width: 200%;
		height: 200%;
		background: linear-gradient(
			45deg,
			transparent 30%,
			rgba(255, 255, 255, 0.8) 50%,
			transparent 70%
		);
		animation: shinyMove 2.5s linear infinite;
	}

	.hexagon.music-center:hover {
		background: linear-gradient(135deg, #FFEB3B 0%, #FFF9C4 25%, #FFEB3B 50%, #FFF9C4 75%, #FFEB3B 100%);
		background-size: 200% 200%;
		box-shadow: 
			inset 0 0 clamp(35px, 4vw, 70px) rgba(255, 255, 255, 0.9),
			0 0 clamp(40px, 4.5vw, 80px) rgba(255, 215, 0, 1),
			0 clamp(6px, 0.8vw, 12px) clamp(20px, 2.5vw, 40px) rgba(255, 235, 59, 0.8);
		transform: scale(1.15) rotate(5deg);
	}

	.hexagon.music-center .hexagon-content {
		font-size: clamp(2rem, 4vw, 3.5rem);
		z-index: 20;
		filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
	}

	@keyframes shinyGlow {
		0%, 100% {
			background-position: 0% 50%;
		}
		50% {
			background-position: 100% 50%;
		}
	}

	@keyframes shinyMove {
		0% {
			transform: translateX(-100%) translateY(-100%) rotate(45deg);
		}
		100% {
			transform: translateX(100%) translateY(100%) rotate(45deg);
		}
	}
</style>

				<a href="{{ url_for('qcm19') }}" class="hexagon theme-5" onclick="hexClick(this, event)" data-theme="Thème 5 : Éthique & Responsabilité" onmouseenter="showTooltip(event, this)" onmouseleave="hideTooltip()">
					<div class="hexagon-content"> QCM 19</div>
				</a>
			</div>

			<!-- Rangée 9: 1 hexagone - THÈME 5 -->
			<div class="hex-row">
				<a href="{{ url_for('qcm20') }}" class="hexagon theme-5" onclick="hexClick(this, event)" data-theme="Thème 5 : Éthique & Responsabilité" onmouseenter="showTooltip(event, this)" onmouseleave="hideTooltip()">
					<div class="hexagon-content"> QCM 20</div>
				</a>
			</div>
		</div>
	</div>
</div>

<!-- Tooltip pour afficher le thème -->
<div class="theme-tooltip" id="themeTooltip"></div>

<!-- Effet de brouillard sur les bords -->
<div class="fog-overlay">
	<div class="fog-top"></div>
	<div class="fog-bottom"></div>
	<div class="fog-left"></div>
	<div class="fog-right"></div>
</div>

<!-- Panneau de score -->
<div class="score-panel">
	<div class="score-title">🏆 Votre Score 🏆</div>
	<div class="score-value" id="currentScore">0 / 20</div>
	<button class="reset-btn" onclick="resetPlayerScore()">🔄 Réinitialiser</button>
</div>

<!-- Contrôles de zoom -->
<div class="zoom-controls">
	<button class="zoom-btn" onclick="zoomIn()" title="Zoomer">+</button>
	<div class="zoom-level" id="zoomLevel">100%</div>
	<button class="zoom-btn" onclick="zoomOut()" title="Dézoomer">−</button>
	<button class="zoom-btn" onclick="resetZoom()" title="Réinitialiser" style="font-size: 1.2rem;">⟲</button>
</div>

<script>
let currentZoom = 1;
const minZoom = 0.3;
const maxZoom = 2;
const zoomStep = 0.1;

// Afficher le score au chargement
function displayPlayerScore() {
	const score = parseInt(localStorage.getItem('qcmScore') || '0');
	document.getElementById('currentScore').textContent = `${score} / 20`;
}

// Réinitialiser le score
function resetPlayerScore() {
	if (confirm('Voulez-vous vraiment réinitialiser votre score à 0 ?')) {
		localStorage.setItem('qcmScore', '0');
		displayPlayerScore();
	}
}

// Afficher le score au chargement de la page
window.addEventListener('DOMContentLoaded', displayPlayerScore);

function updateZoom() {
	const grid = document.querySelector('.honeycomb-grid');
	grid.style.transform = `scale(${currentZoom})`;
	document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
}

function zoomIn() {
	if (currentZoom < maxZoom) {
		currentZoom += zoomStep;
		updateZoom();
	}
}

function zoomOut() {
	if (currentZoom > minZoom) {
		currentZoom -= zoomStep;
		updateZoom();
	}
}

function resetZoom() {
	currentZoom = 1;
	updateZoom();
}

// Support du zoom avec la molette + Ctrl/Cmd
document.querySelector('.honeycomb-container').addEventListener('wheel', (e) => {
	if (e.ctrlKey || e.metaKey) {
		e.preventDefault();
		if (e.deltaY < 0) {
			zoomIn();
		} else {
			zoomOut();
		}
	}
}, { passive: false });

function hexClick(element, event) {
	// Ajoute la classe pour l'animation
	element.classList.add('clicked');
	
	// Retire la classe après l'animation
	setTimeout(() => {
		element.classList.remove('clicked');
	}, 600);
	
	// Le lien naviguera automatiquement après l'animation
	const content = element.querySelector('.hexagon-content').textContent;
	console.log('Hexagone cliqué:', content);
}

// Gestion du tooltip pour afficher le thème
function showTooltip(event, element) {
	const tooltip = document.getElementById('themeTooltip');
	const themeName = element.getAttribute('data-theme');
	const themeClass = element.classList.contains('theme-1') ? 'theme-1' :
					   element.classList.contains('theme-2') ? 'theme-2' :
					   element.classList.contains('theme-3') ? 'theme-3' :
					   element.classList.contains('theme-4') ? 'theme-4' : 'theme-5';
	
	tooltip.textContent = themeName;
	tooltip.className = 'theme-tooltip ' + themeClass;
	
	// Positionner le tooltip
	updateTooltipPosition(event);
	
	// Afficher le tooltip
	setTimeout(() => {
		tooltip.classList.add('show');
	}, 50);
}

function hideTooltip() {
	const tooltip = document.getElementById('themeTooltip');
	tooltip.classList.remove('show');
}

function updateTooltipPosition(event) {
	const tooltip = document.getElementById('themeTooltip');
	const offset = 15;
	
	tooltip.style.left = event.clientX + offset + 'px';
	tooltip.style.top = event.clientY + offset + 'px';
}

// Mise à jour de la position du tooltip pendant le mouvement de la souris
document.addEventListener('mousemove', (e) => {
	const tooltip = document.getElementById('themeTooltip');
	if (tooltip.classList.contains('show')) {
		updateTooltipPosition(e);
	}
});
</script>

{% endblock %}
