<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini API — Test Predict</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#9aa4b2;
      --accent:#06b6d4;
      --accent-2:#7c3aed;
      --danger:#ef4444;
      --glass: rgba(255,255,255,0.03);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg,#071024 0%, #07172b 100%);
      color:#e6eef8;
      padding:24px;
    }
    .card{
      width:100%;
      max-width:720px;
      background:var(--glass);
      border-radius:14px;
      padding:24px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      border:1px solid rgba(255,255,255,0.05);
    }
    header h1{ font-size:22px; margin:0 0 6px 0 }
    header p{ color:var(--muted); margin:0 0 16px 0 }
    form{ display:flex; flex-direction:column; gap:14px }
    label{ font-size:14px; color:var(--muted) }
    input, textarea{
      background:var(--glass);
      border:1px solid rgba(255,255,255,0.05);
      color:inherit;
      padding:10px;
      border-radius:8px;
      outline:none;
      resize:vertical;
    }
    textarea{ min-height:120px }
    button{
      padding:10px 14px;
      border-radius:10px;
      border:0;
      cursor:pointer;
      font-weight:600;
      color:#052027;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      box-shadow: 0 8px 20px rgba(7,19,41,0.45);
      margin-top:8px;
    }
    .result{
      margin-top:20px;
      padding:14px;
      border-radius:10px;
      background: rgba(255,255,255,0.03);
      min-height:70px;
    }
    .meta{ font-size:13px; color:var(--muted) }
    .loader{
      width:18px; height:18px; border-radius:50%;
      border:2px solid rgba(255,255,255,0.06);
      border-top-color:var(--accent);
      animation:spin 1s linear infinite;
      display:inline-block;
    }
    @keyframes spin{ to{ transform:rotate(360deg) } }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <h1>Mini API – Test</h1>
      <p>Envoie deux champs (<strong>title</strong> et <strong>text</strong>) à l’API <code>/predict</code>.</p>
    </header>

    <form id="predict-form" action="/predict" method="POST">
      <div>
        <label for="title">Titre</label>
        <input id="title" name="title" type="text" placeholder="Votre titre..." required />
      </div>

      <div>
        <label for="text">Texte</label>
        <textarea id="text" name="text" placeholder="Votre texte..." required></textarea>
      </div>

      <button type="submit">Envoyer</button>
    </form>

    <div class="result" id="result">
      {% if data is not none %}
        <div class="meta">
          {% if data == 1 %}
            <p><strong style="color: #10b981;">✓ vrai article</strong></p>
          {% elif data == 0 %}
            <p><strong style="color: #ef4444;">✗ article douteux</strong></p>
          {% endif %}
        </div>
      {% else %}
        <p style="color: var(--muted);">Envoyez un titre et un texte pour obtenir une prédiction.</p>
      {% endif %}
    </div>
  </main>


</body>
</html>
