{% extends 'layout.html' %}

{% block content %}
<style>
	.article-container {
		max-width: 800px;
		margin: 0 auto;
		padding: 2rem 1rem;
		background-color: #ffffff;
	}
	
	.article-header {
		margin-bottom: 2rem;
		border-bottom: 3px solid #667eea;
		padding-bottom: 1.5rem;
	}
	
	.article-category {
		display: inline-block;
		background-color: #667eea;
		color: white;
		padding: 0.25rem 1rem;
		border-radius: 20px;
		font-size: 0.875rem;
		font-weight: 600;
		text-transform: uppercase;
		letter-spacing: 0.5px;
		margin-bottom: 1rem;
	}
	
	.article-title {
		font-size: 2.5rem;
		font-weight: 700;
		color: #2c3e50;
		line-height: 1.2;
		margin-bottom: 1rem;
	}
	
	.article-meta {
		display: flex;
		gap: 1.5rem;
		color: #6c757d;
		font-size: 0.9rem;
		margin-bottom: 0.5rem;
	}
	
	.article-meta i {
		margin-right: 0.5rem;
	}
	
	.article-author {
		font-weight: 600;
		color: #495057;
	}
	
	.article-lead {
		font-size: 1.25rem;
		color: #495057;
		line-height: 1.6;
		margin-bottom: 2rem;
		font-weight: 400;
		font-style: italic;
		border-left: 4px solid #764ba2;
		padding-left: 1.5rem;
	}
	
	.article-image {
		width: 100%;
		height: auto;
		margin-bottom: 1rem;
		border-radius: 8px;
		box-shadow: 0 4px 6px rgba(0,0,0,0.1);
	}
	
	.article-image-caption {
		font-size: 0.875rem;
		color: #6c757d;
		font-style: italic;
		margin-bottom: 2rem;
		text-align: center;
	}
	
	.article-content {
		font-size: 1.125rem;
		line-height: 1.8;
		color: #2c3e50;
	}
	
	.article-content p {
		margin-bottom: 1.5rem;
	}
	
	.article-content h2 {
		font-size: 1.75rem;
		font-weight: 700;
		color: #2c3e50;
		margin-top: 2.5rem;
		margin-bottom: 1rem;
	}
	
	.article-content h3 {
		font-size: 1.5rem;
		font-weight: 600;
		color: #495057;
		margin-top: 2rem;
		margin-bottom: 1rem;
	}
	
	.article-content blockquote {
		background-color: #f8f9fa;
		border-left: 5px solid #667eea;
		padding: 1.5rem;
		margin: 2rem 0;
		font-style: italic;
		color: #495057;
	}
	
	.article-content ul, .article-content ol {
		margin-bottom: 1.5rem;
		padding-left: 2rem;
	}
	
	.article-content li {
		margin-bottom: 0.5rem;
	}
	
	.article-footer {
		margin-top: 3rem;
		padding-top: 2rem;
		border-top: 2px solid #e9ecef;
	}
	
	.article-tags {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
		margin-bottom: 1.5rem;
	}
	
	.article-tag {
		background-color: #e9ecef;
		color: #495057;
		padding: 0.25rem 0.75rem;
		border-radius: 15px;
		font-size: 0.875rem;
		text-decoration: none;
		transition: all 0.2s ease;
	}
	
	.article-tag:hover {
		background-color: #764ba2;
		color: white;
	}
	
	.article-share {
		display: flex;
		align-items: center;
		gap: 1rem;
	}
	
	.article-share-label {
		font-weight: 600;
		color: #495057;
	}
	
	.share-button {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		width: 40px;
		height: 40px;
		border-radius: 50%;
		background-color: #667eea;
		color: white;
		text-decoration: none;
		transition: all 0.3s ease;
	}
	
	.share-button:hover {
		background-color: #764ba2;
		color: white;
		transform: translateY(-3px);
	}
	
	@media (max-width: 768px) {
		.article-title {
			font-size: 2rem;
		}
		
		.article-content {
			font-size: 1rem;
		}
		
		.article-meta {
			flex-direction: column;
			gap: 0.5rem;
		}
	}
</style>

<article class="article-container">
	<header class="article-header">
		<h1 class="article-title">{{ article.title|default('Titre de l\'article') }}</h1>
	</header>
	
	{% if article.lead %}
	<p class="article-lead">{{ article.lead }}</p>
	{% endif %}
	
	{% if article.image %}
	<figure>
		<img src="{{ article.image }}" alt="{{ article.image_alt|default('Image de l\'article') }}" class="article-image">
		{% if article.image_caption %}
		<figcaption class="article-image-caption">{{ article.image_caption }}</figcaption>
		{% endif %}
	</figure>
	{% endif %}
	
	<div class="article-content">
		{% block article_content %}
		<p>Contenu de l'article à définir ici...</p>
		{% endblock %}
	</div>
	
</article>
{% endblock %}
