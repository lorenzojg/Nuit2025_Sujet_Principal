{% extends 'article_layout.html' %}

{% block content %}
<style>
    /* Fond et scroll global comme le honeycomb */
    body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
        position: relative;
    }

    body::-webkit-scrollbar {
        width: 12px;
    }

    body::-webkit-scrollbar-track {
        background: #1a1a1a;
        border-left: 1px solid #333;
    }

    body::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #FFC107 0%, #FFA000 100%);
        border-radius: 6px;
        border: 2px solid #1a1a1a;
    }

    body::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #FFD54F 0%, #FFC107 100%);
        box-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
    }

    body {
        scrollbar-width: thin;
        scrollbar-color: #FFC107 #1a1a1a;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
            radial-gradient(circle at 20% 30%, rgba(255, 193, 7, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(255, 235, 59, 0.1) 0%, transparent 50%),
            radial-gradient(circle at 50% 50%, rgba(255, 193, 7, 0.05) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
    }

    /* Container de l'article avec fond transparent pour laisser voir le body */
    .article-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 6rem 1rem 2rem 1rem;
        background-color: transparent; /* <-- ici on enlève le blanc */
        position: relative;
        z-index: 1;
    }

    /* Styles existants de l'article */
    .article-header {
        margin-bottom: 2rem;
        border-bottom: 3px solid #667eea;
        padding-bottom: 1.5rem;
    }

    .article-title {
        font-size: 2.5rem;
        font-weight: 700;
        color: #FFC107;
        line-height: 1.2;
        margin-bottom: 1rem;
    }

    .article-lead {
        font-size: 1.25rem;
        color: #FFD54F;
        line-height: 1.6;
        margin-bottom: 2rem;
        font-weight: 400;
        font-style: italic;
        border-left: 4px solid #764ba2;
        padding-left: 1.5rem;
    }

    .article-content {
        font-size: 1.125rem;
        line-height: 1.8;
        color: #FFD54F;
    }

    .article-content p {
        margin-bottom: 1.5rem;
    }

    /* ...reste du CSS de l'article inchangé... */
</style>

<article class="article-container">
    <header class="article-header">
        <h1 class="article-title">{{ article.title|default('Titre de l\'article') }}</h1>
    </header>

    {% if article.lead %}
    <p class="article-lead">{{ article.lead }}</p>
    {% endif %}

    <div class="article-content">
        {% block article_content %}
        <p>Contenu de l'article à définir ici...</p>
        {% endblock %}
    </div>
</article>
{% endblock %}
